app:
  name: "pulseflow"
  version: "dev"
  env: "development"

admin:
  auth_required: false

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 120s
  idle_timeout: 120s
  shutdown_timeout: 20s
  max_body_bytes: 10485760

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 25
  min_idle_conns: 5
  # Fail startup when Redis is unreachable (otherwise run in degraded mode).
  required: false

postgres:
  dsn: "postgres://postgres:postgres@localhost:5432/pulseflow?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  # Fail startup when Postgres is unreachable (otherwise run in degraded mode).
  required: false

events:
  stream_name: "pulseflow:events"
  group_name: "pulseflow:workers"
  dlq_stream_name: "pulseflow:dlq"
  consumer_name: ""  # auto-generated if empty
  batch_size: 100
  max_pending: 500
  # How often to scan for stale pending messages and claim them via XCLAIM.
  claim_scan_interval: 30s
  # Minimum idle time before a pending message is eligible for claim.
  claim_min_idle: 60s
  # Number of consumer goroutines.
  consumer_concurrency: 4

webhooks:
  enabled: false
  timeout: 30s
  max_retries: 3
  retry_delay: 5s

rate_limit:
  enabled: true
  default_rps: 200.0
  burst_multiplier: 2
  strategy: "token_bucket"

circuit_breaker:
  redis:
    max_failures: 5
    reset_timeout: 60s
    half_open_max_calls: 3
  postgres:
    max_failures: 5
    reset_timeout: 60s
    half_open_max_calls: 3

logging:
  level: "info"
  format: "json"

metrics:
  enabled: true
  path: "/metrics"

tracing:
  enabled: false
  service_name: "pulseflow"
  exporter: "otlphttp"
  endpoint: "localhost:4318"
  sample_rate: 1.0

transformation:
  enabled: false
  timeout: 500ms

schema_validation:
  enabled: false
  dlq_on_failure: true

deduplication:
  enabled: false
  window: 1h

compliance:
  pii_enabled: false
  audit_enabled: false
  audit_secret: ""
  redact_dlq: true
  redact_logs: true

monitor:
  enabled: false
  check_interval: 5m

embed:
  enabled: false
  token_secret: ""
  token_ttl: 24h